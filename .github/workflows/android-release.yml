name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (for example 1.0.2)'
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${INPUT_VERSION:-${REF_NAME#v}}"
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          export VERSION
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('app.json','utf8'));p.expo.version=process.env.VERSION;p.expo.android={...(p.expo.android||{}),versionCode:1000+Number(process.env.RUN_NUMBER)};fs.writeFileSync('app.json',JSON.stringify(p,null,2));"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/quest-release.keystore
          python3 scripts/configure-android-signing.py

      - name: Build release APK
        env:
          QUEST_STORE_PASSWORD: ${{ secrets.QUEST_STORE_PASSWORD }}
          QUEST_KEY_ALIAS: ${{ secrets.QUEST_KEY_ALIAS }}
          QUEST_KEY_PASSWORD: ${{ secrets.QUEST_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare release metadata
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk app-release.apk
          node -e "const fs=require('fs');const version=process.env.VERSION;const repo=process.env.GITHUB_REPOSITORY;const notes=(process.env.NOTES||'').split('\\n')[0]||('Quest '+version);fs.writeFileSync('latest.json',JSON.stringify({version,notes,apk_url:'https://github.com/'+repo+'/releases/latest/download/app-release.apk'},null,2));"
          cat latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: Quest v${{ env.VERSION }}
          body: |
            Signed Android build of Quest v${{ env.VERSION }}.
            In-app: Settings → App update.
          files: |
            app-release.apk
            latest.json
